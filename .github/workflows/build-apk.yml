name: Crear APK desde HTML

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Preparar proyecto Android
        run: |
          rm -rf apk-project
          mkdir -p apk-project/app/src/main/assets/www
          mkdir -p apk-project/app/src/main/java/com/htmltoapk/builder

          unzip -o input-web.zip -d web-source

          if [ -f "web-source/index.html" ]; then
            cp -r web-source/* apk-project/app/src/main/assets/www/
          else
            echo "ERROR: No se encontró index.html dentro de input-web.zip"
            exit 1
          fi

          cat > apk-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLtoAPK"
          include(":app")
          EOF

          cat > apk-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          EOF

          cat > apk-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > apk-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmltoapk.builder'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.htmltoapk.builder'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.15.0'
          }
          EOF

          cat > apk-project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="HTML to APK"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p apk-project/app/src/main/res/values

          cat > apk-project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00BCD4</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java <<'EOF'
          package com.htmltoapk.builder;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(
                          new WebViewClient() {
                              @Override
                              public android.webkit.WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      android.webkit.WebResourceRequest request) {
                                  return assetLoader.shouldInterceptRequest(request.getUrl());
                              }
                          }
                  );

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/www/index.html"
                  );

                  setContentView(webView);
              }
          }
          EOF

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK
        working-directory: apk-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk-debug
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
