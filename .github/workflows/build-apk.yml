name: Crear APK desde HTML

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Preparar archivos HTML
        run: |
          set -e
          rm -rf web-src apk-project
          mkdir -p web-src apk-project/app/src/main/assets/www
          test -f input-web.zip || { echo "ERROR: No existe input-web.zip"; exit 1; }
          unzip -q input-web.zip -d web-src
          INDEX_FILE="$(find web-src -type f -iname 'index.html' | head -n 1)"
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No se encontro index.html dentro de input-web.zip"
            exit 1
          fi
          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEB_ROOT"/. apk-project/app/src/main/assets/www/
          test -f apk-project/app/src/main/assets/www/index.html || { echo "ERROR: No se pudo copiar index.html"; exit 1; }

      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p apk-project/app/src/main/java/com/htmltoapk/builder
          mkdir -p apk-project/app/src/main/res/values

          echo '' | base64 -d > apk-project/settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > apk-project/build.gradle
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQo=' | base64 -d > apk-project/gradle.properties
          echo '' | base64 -d > apk-project/app/build.gradle
          echo '' | base64 -d > apk-project/app/src/main/AndroidManifest.xml
          echo '' | base64 -d > apk-project/app/src/main/res/values/styles.xml
          echo '' | base64 -d > apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java

      - name: Verificar proyecto
        run: |
          set -e
          echo "=== Java ==="
          java -version
          echo "=== Android SDK ==="
          sdkmanager --list_installed | head -n 30
          echo "=== Archivos ==="
          find apk-project -maxdepth 7 -type f | sort

      - name: Descargar Gradle 8.9
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Compilar APK
        working-directory: apk-project
        run: |
          set -e
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: html-a-apk
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
