name: Crear APK desde HTML

on:
  workflow_dispatch:

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repositorio de cheques
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes del SDK de Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar archivos web
        shell: bash
        run: |
          set -e
          rm -rf apk-project
          mkdir -p apk-project/app/src/main/assets/www
          mkdir -p apk-project/app/src/main/java/com/htmltoapk/builder
          mkdir -p apk-project/app/src/main/res/values

          if [ ! -f input-web.zip ]; then
            echo "ERROR: No se encontró input-web.zip en la raíz del repositorio."
            exit 1
          fi

          mkdir -p web-source
          unzip -q -o input-web.zip -d web-source

          INDEX_FILE="$(find web-source -type f -iname 'index.html' -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No se encontró index.html dentro de input-web.zip."
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEB_ROOT"/. apk-project/app/src/main/assets/www/

          if [ ! -f apk-project/app/src/main/assets/www/index.html ]; then
            echo "ERROR: No se pudo copiar index.html al proyecto Android."
            exit 1
          fi

      - name: Crear proyecto Android
        shell: bash
        run: |
          set -e

          cat > apk-project/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HTMLtoAPK"
include(":app")
EOF

          cat > apk-project/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > apk-project/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

          cat > apk-project/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.htmltoapk.builder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.htmltoapk.builder'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
EOF

          cat > apk-project/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:label="HTML a APK"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>
    </application>

</manifest>
EOF

          cat > apk-project/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#00A8FF</item>
        <item name="android:windowActionModeOverlay">true</item>
    </style>
</resources>
EOF

          cat > apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java <<'EOF'
package com.htmltoapk.builder;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebViewClient;

import androidx.webkit.WebViewAssetLoader;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);

        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(false);
        webView.getSettings().setAllowContentAccess(false);

        WebViewAssetLoader assetLoader =
                new WebViewAssetLoader.Builder()
                        .addPathHandler(
                                "/assets/",
                                new WebViewAssetLoader.AssetsPathHandler(this)
                        )
                        .build();

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    WebResourceRequest request
            ) {
                return assetLoader.shouldInterceptRequest(request.getUrl());
            }
        });

        webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");

        setContentView(webView);
    }
}
EOF

      - name: Descargar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: apk-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: html-a-apk
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
