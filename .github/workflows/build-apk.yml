name: Crear APK desde HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar HTML a APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK de Android
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -e

          rm -rf apk-project web-source
          mkdir -p apk-project/app/src/main/assets/www
          mkdir -p apk-project/app/src/main/java/com/htmltoapk/builder
          mkdir -p apk-project/app/src/main/res/values

          if [ ! -f "input-web.zip" ]; then
            echo "ERROR: No se encontró input-web.zip en la raíz del repositorio."
            exit 1
          fi

          unzip -o input-web.zip -d web-source

          INDEX_FILE="$(find web-source -type f -iname 'index.html' -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No se encontró index.html dentro de input-web.zip."
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEB_ROOT"/. apk-project/app/src/main/assets/www/

          test -f apk-project/app/src/main/assets/www/index.html || {
            echo "ERROR: No se pudo copiar index.html al proyecto Android."
            exit 1
          }

      - name: Crear archivos Gradle
        shell: bash
        run: |
          cat > apk-project/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HTMLtoAPK"
include(":app")
EOF

          cat > apk-project/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '9.4.0' apply false
}
EOF

          cat > apk-project/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

          cat > apk-project/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.htmltoapk.builder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.htmltoapk.builder'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
EOF

      - name: Crear AndroidManifest
        shell: bash
        run: |
          cat > apk-project/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:label="HTML a APK"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>
    </application>

</manifest>
EOF

          cat > apk-project/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#0088CC</item>
        <item name="android:windowActionModeOverlay">true</item>
    </style>
</resources>
EOF

      - name: Crear MainActivity.java
        shell: bash
        run: |
          cat > apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java <<'EOF'
package com.htmltoapk.builder;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import androidx.webkit.WebViewAssetLoader;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);

        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(false);
        webView.getSettings().setAllowContentAccess(false);

        WebViewAssetLoader assetLoader =
                new WebViewAssetLoader.Builder()
                        .addPathHandler(
                                "/assets/",
                                new WebViewAssetLoader.AssetsPathHandler(this)
                        )
                        .build();

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    WebResourceRequest request
            ) {
                return assetLoader.shouldInterceptRequest(request.getUrl());
            }
        });

        webView.loadUrl(
                "https://appassets.androidplatform.net/assets/www/index.html"
        );

        setContentView(webView);
    }
}
EOF

      - name: Verificar proyecto generado
        shell: bash
        run: |
          test -f apk-project/app/src/main/AndroidManifest.xml
          test -f apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java
          test -f apk-project/app/src/main/assets/www/index.html

          echo "Contenido del proyecto:"
          find apk-project/app/src/main/assets/www -maxdepth 2 -type f | sort | head -100

      - name: Compilar APK
        working-directory: apk-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: html-a-apk
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
