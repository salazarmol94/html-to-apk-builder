name: Create APK from HTML

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'
      - name: Prepare web source
        shell: bash
        run: |
          set -e
          rm -rf web-source apk-project
          mkdir -p web-source apk-project/app/src/main/assets/www
          mkdir -p apk-project/app/src/main/java/com/htmltoapk/builder
          mkdir -p apk-project/app/src/main/res/values
          test -f input-web.zip || { echo "ERROR: input-web.zip was not found."; exit 1; }
          unzip -q input-web.zip -d web-source
          INDEX_FILE="$(find web-source -type f -iname 'index.html' -print -quit)"
          if [ -z "$INDEX_FILE" ]; then echo "ERROR: No index.html was found inside input-web.zip."; exit 1; fi
          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEB_ROOT"/. apk-project/app/src/main/assets/www/
          test -f apk-project/app/src/main/assets/www/index.html || { echo "ERROR: index.html could not be copied."; exit 1; }
      - name: Create Android project
        shell: bash
        run: |
          set -e
          cat > apk-project/settings.gradle <<'EOT'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = "HTMLtoAPK"
include(":app")
EOT
          cat > apk-project/build.gradle <<'EOT'
plugins { id 'com.android.application' version '9.4.0' apply false }
EOT
          cat > apk-project/gradle.properties <<'EOT'
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOT
          cat > apk-project/app/build.gradle <<'EOT'
plugins { id 'com.android.application' }
android { namespace 'com.htmltoapk.builder'; compileSdk 36
  defaultConfig { applicationId 'com.htmltoapk.builder'; minSdk 23; targetSdk 36; versionCode 1; versionName '1.0' }
}
dependencies { implementation 'androidx.webkit:webkit:1.15.0' }
EOT
          cat > apk-project/app/src/main/AndroidManifest.xml <<'EOT'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application android:allowBackup="true" android:label="HTML to APK" android:supportsRtl="true" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
        </activity>
    </application>
</manifest>
EOT
          cat > apk-project/app/src/main/res/values/styles.xml <<'EOT'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#00BCD4</item></style></resources>
EOT
          cat > apk-project/app/src/main/java/com/htmltoapk/builder/MainActivity.java <<'EOT'
package com.htmltoapk.builder;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.webkit.WebViewAssetLoader;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView = new WebView(this);
        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(false);
        webView.getSettings().setAllowContentAccess(false);
        WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                .build();
        webView.setWebViewClient(new WebViewClient() {
            @Override
            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                return assetLoader.shouldInterceptRequest(request.getUrl());
            }
        });
        webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
        setContentView(webView);
    }
}
EOT
      - name: Build APK
        working-directory: apk-project
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk-debug
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
