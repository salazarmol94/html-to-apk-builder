name: EleCal v18

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Prepare
        shell: bash
        run: |
          set -e
          rm -rf apk-project web-source
          mkdir -p apk-project/app/src/main/assets/www
          mkdir -p apk-project/app/src/main/java/com/elecal/app
          mkdir -p apk-project/app/src/main/res/values
          mkdir -p apk-project/app/src/main/res/drawable
          mkdir -p apk-project/app/src/main/res/mipmap-mdpi
          mkdir -p apk-project/app/src/main/res/mipmap-hdpi
          mkdir -p apk-project/app/src/main/res/mipmap-xhdpi
          mkdir -p apk-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p apk-project/app/src/main/res/mipmap-xxxhdpi
          test -f input-web.zip
          unzip -q input-web.zip -d web-source
          INDEX_FILE="$(find web-source -type f -iname 'index.html' -print -quit)"
          test -n "$INDEX_FILE"
          WEB_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEB_ROOT"/. apk-project/app/src/main/assets/www/
          ICON="$(find "$WEB_ROOT" -type f -iname 'icon.png' -print -quit)"
          test -n "$ICON"
          cp "$ICON" apk-project/app/src/main/res/drawable/ic_launcher.png
          cp "$ICON" apk-project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "$ICON" apk-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$ICON" apk-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "$ICON" apk-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$ICON" apk-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Write Gradle files
        shell: bash
        run: |
          echo  | base64 -d > apk-project/settings.gradle
          echo cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg== | base64 -d > apk-project/build.gradle
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgzZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg== | base64 -d > apk-project/gradle.properties
          echo  | base64 -d > apk-project/app/build.gradle

      - name: Write Android files
        shell: bash
        run: |
          echo PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5FbGVDYWw8L3N0cmluZz48L3Jlc291cmNlcz4= | base64 -d > apk-project/app/src/main/res/values/strings.xml
          echo PHJlc291cmNlcz4KPHN0eWxlIG5hbWU9IkFwcFRoZW1lIiBwYXJlbnQ9ImFuZHJvaWQ6c3R5bGUvVGhlbWUuTWF0ZXJpYWwuTGlnaHQuTm9BY3Rpb25CYXIiPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpmb250RmFtaWx5Ij5zYW5zPC9pdGVtPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpjb2xvckFjY2VudCI+IzAwYmNkNDwvaXRlbT4KPC9zdHlsZT4KPC9yZXNvdXJjZXM+ | base64 -d > apk-project/app/src/main/res/values/styles.xml
          echo  | base64 -d > apk-project/app/src/main/AndroidManifest.xml
          echo  | base64 -d > apk-project/app/src/main/java/com/elecal/app/MainActivity.java

      - name: Verify
        shell: bash
        run: |
          test -f apk-project/app/src/main/assets/www/index.html
          test -f apk-project/app/src/main/assets/www/icons/icon.png
          test -f apk-project/app/src/main/res/drawable/ic_launcher.png
          test -f apk-project/app/src/main/java/com/elecal/app/MainActivity.java

      - name: Build APK
        working-directory: apk-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EleCal-v20-APK
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
