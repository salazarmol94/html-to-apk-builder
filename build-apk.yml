name: Build APK from Web ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Prepare web files
        shell: bash
        run: |
          set -e
          rm -rf web-input
          mkdir -p web-input
          unzip -q input-web.zip -d web-input

          if [ -f web-input/index.html ]; then
            echo "WEB_ROOT=web-input" >> "$GITHUB_ENV"
          else
            INDEX_FILE=$(find web-input -type f -name "index.html" | head -n 1)
            if [ -z "$INDEX_FILE" ]; then
              echo "No se encontró index.html dentro de input-web.zip"
              exit 1
            fi
            echo "WEB_ROOT=$(dirname "$INDEX_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project/app/src/main/assets/www
          mkdir -p android-project/app/src/main/java/com/example/htmltoapk
          mkdir -p android-project/app/src/main/res/values

          cp -R "$WEB_ROOT"/. android-project/app/src/main/assets/www/

          cat > android-project/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HTMLToAPK"
include(":app")
EOF

          cat > android-project/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '9.4.0' apply false
}
EOF

          cat > android-project/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
EOF

          cat > android-project/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.htmltoapk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.htmltoapk'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">HTML to APK Test</string>
</resources>
EOF

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
</resources>
EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:theme="@style/AppTheme"
        android:label="@string/app_name"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > android-project/app/src/main/java/com/example/htmltoapk/MainActivity.java <<'EOF'
package com.example.htmltoapk;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;

import androidx.webkit.WebViewAssetLoader;
import androidx.webkit.WebViewClient;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(false);
        settings.setAllowContentAccess(false);

        WebViewAssetLoader assetLoader =
                new WebViewAssetLoader.Builder()
                        .addPathHandler(
                                "/assets/",
                                new WebViewAssetLoader.AssetsPathHandler(this)
                        )
                        .build();

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    WebResourceRequest request
            ) {
                return assetLoader.shouldInterceptRequest(request.getUrl());
            }
        });

        webView.loadUrl(
                "https://appassets.androidplatform.net/assets/www/index.html"
        );

        setContentView(webView);
    }
}
EOF

      - name: Install Gradle 9.6
        working-directory: android-project
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.6-bin.zip
          unzip -q gradle.zip
          mv gradle-9.6 gradle-dist

      - name: Build debug APK
        working-directory: android-project
        run: |
          ./gradle-dist/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
