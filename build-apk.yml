name: Build APK from Web ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Unpack web ZIP
        shell: bash
        run: |
          set -e
          rm -rf build-input
          mkdir build-input
          unzip -q input-web.zip -d build-input
          if [ -f build-input/index.html ]; then
            echo "WEB_ROOT=build-input" >> "$GITHUB_ENV"
          else
            INDEX_PATH=$(find build-input -type f -name index.html | head -n 1)
            test -n "$INDEX_PATH"
            echo "WEB_ROOT=$(dirname "$INDEX_PATH")" >> "$GITHUB_ENV"
          fi

      - name: Generate Android WebView project
        shell: bash
        run: |
          set -e
          rm -rf android-build
          mkdir -p android-build/app/src/main/assets/www
          mkdir -p android-build/app/src/main/java/com/example/htmlapk
          mkdir -p android-build/app/src/main/res/values
          cp -R "$WEB_ROOT"/. android-build/app/src/main/assets/www/

          cat > android-build/settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories { google(); mavenCentral() }
}
rootProject.name='HTMLToAPK'
include ':app'
EOF

          cat > android-build/build.gradle <<'EOF'
plugins { id 'com.android.application' version '9.4.0' apply false }
EOF

          cat > android-build/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
EOF

          cat > android-build/app/build.gradle <<'EOF'
plugins { id 'com.android.application' }
android {
  namespace 'com.example.htmlapk'
  compileSdk 36
  defaultConfig {
    applicationId 'com.example.htmlapk'
    minSdk 23
    targetSdk 36
    versionCode 1
    versionName '1.0'
  }
}
dependencies { implementation 'androidx.webkit:webkit:1.15.0' }
EOF

          cat > android-build/app/src/main/res/values/strings.xml <<'EOF'
<resources><string name="app_name">HTML APK Test</string></resources>
EOF

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET"/>
  <application android:theme="@style/AppTheme" android:label="@string/app_name" android:usesCleartextTraffic="true">
    <activity android:name=".MainActivity" android:exported="true">
      <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
    </activity>
  </application>
</manifest>
EOF

          cat > android-build/app/src/main/java/com/example/htmlapk/MainActivity.java <<'EOF'
package com.example.htmlapk;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import androidx.webkit.WebViewAssetLoader;
import androidx.webkit.WebViewClient;

public class MainActivity extends Activity {
  @Override public void onCreate(Bundle state) {
    super.onCreate(state);
    WebView web = new WebView(this);
    WebSettings s = web.getSettings();
    s.setJavaScriptEnabled(true);
    s.setDomStorageEnabled(true);
    WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
    web.setWebViewClient(new WebViewClient() {
      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
        return loader.shouldInterceptRequest(r.getUrl());
      }
    });
    web.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
    setContentView(web);
  }
}
EOF

      - name: Gradle 9.6
        working-directory: android-build
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.6-bin.zip
          unzip -q gradle.zip
          mv gradle-9.6 gradle-dist

      - name: Build APK
        working-directory: android-build
        run: ./gradle-dist/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
