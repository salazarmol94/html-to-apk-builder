<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → APK Builder V5</title>
<style>
body{font-family:Arial;background:#0b1220;color:#eaf1ff;margin:0}main{max-width:850px;margin:40px auto;padding:24px}
.card{background:#111b2e;border:1px solid #263653;border-radius:18px;padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;color:#aebbd1}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #344663;background:#0b1425;color:white}
button{margin-top:20px;padding:13px 18px;border:0;border-radius:10px;background:#2d7ff9;color:white;font-weight:bold}
.status{margin-top:18px;padding:14px;background:#0a1424;border-radius:10px;white-space:pre-wrap}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main><div class="card">
<h1>HTML → APK Builder V5</h1>
<p>Interfaz preparada para el motor de compilación en GitHub Actions.</p>
<div class="grid">
<div><label>Archivo ZIP</label><input id="zip" type="file" accept=".zip"></div>
<div><label>Nombre</label><input id="name" value="Mi Aplicación"></div>
<div><label>Package name</label><input id="pkg" value="com.example.miapp"></div>
<div><label>Versión</label><input id="version" value="1.0.0"></div>
<div><label>Orientación</label><select id="orientation"><option>Automática</option><option>Vertical</option><option>Horizontal</option></select></div>
<div><label>Pantalla completa</label><select id="fullscreen"><option>No</option><option>Sí</option></select></div>
</div>
<button onclick="build()">Preparar APK</button>
<div id="status" class="status">Esperando archivo...</div>
</div></main>
<script>
function build(){
 const f=document.getElementById('zip').files[0], s=document.getElementById('status');
 if(!f){s.textContent='Selecciona un ZIP primero.';return}
 s.textContent='Archivo: '+f.name+'\n\nV5: el motor real se ejecutará en GitHub Actions.\nPara la primera prueba usa el workflow del repositorio con input-web.zip.';
}
</script></body></html>
