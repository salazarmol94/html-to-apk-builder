<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML to APK - Prueba</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #101827; color: white; }
    .card { max-width: 600px; margin: 40px auto; padding: 28px; border-radius: 18px; background: #182338; text-align: center; }
    button { padding: 14px 20px; border: 0; border-radius: 10px; cursor: pointer; font-weight: bold; }
    #result { margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>HTML → APK</h1>
    <p>Primera prueba del motor de compilación.</p>
    <button onclick="test()">Probar aplicación</button>
    <div id="result"></div>
  </div>
  <script>
    function test() {
      document.getElementById('result').textContent =
        '¡La aplicación HTML está funcionando dentro del APK!';
    }
  </script>
</body>
</html>
